<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ASTraCAD Workspace</title>
<style>
/* Design system: docs/design-system/MASTER.md. Data-dense + Swiss; status = icon + word + colour. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #f8f9fb; --surface-3: #eef0f3;
  --line: #e2e5ea; --line-strong: #cfd4dc; --ink: #0e1420; --ink-2: #2b3442; --muted: #5b6472;
  --accent: #2456e6; --accent-ink: #ffffff; --accent-soft: #e8eefd; --accent-line: #b9c9f7;
  --ok: #0f7a4f; --ok-soft: #e3f4ec; --warn: #a35a00; --warn-soft: #fdf0dc;
  --bad: #c62038; --bad-soft: #fce8eb; --info: #3a5a8c; --info-soft: #e9eff8;
  --na: #5b6472; --na-soft: #eef0f3;
  --desk: #e6e9ee; --desk-dot: #cfd5de;
  --shadow: 0 1px 2px rgba(14, 20, 32, .06), 0 1px 1px rgba(14, 20, 32, .04);
  --shadow-lg: 0 18px 50px -12px rgba(14, 20, 32, .28), 0 4px 12px rgba(14, 20, 32, .08);
  --radius: 10px; --radius-sm: 6px;
  --font: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --side: 232px; --top: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11; --surface: #12151b; --surface-2: #181c23; --surface-3: #1e232c;
    --line: #252b35; --line-strong: #333b48; --ink: #e9edf3; --ink-2: #c9d0db; --muted: #949eac;
    --accent: #7b9bff; --accent-ink: #0b1020; --accent-soft: #1a2442; --accent-line: #34467e;
    --ok: #4fd39a; --ok-soft: #10291f; --warn: #f3b453; --warn-soft: #2e2210;
    --bad: #ff7a8c; --bad-soft: #33151b; --info: #9fb4d8; --info-soft: #182235;
    --na: #a3acb9; --na-soft: #1e232c; --desk: #07090c; --desk-dot: #1c222b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11; --surface: #12151b; --surface-2: #181c23; --surface-3: #1e232c;
  --line: #252b35; --line-strong: #333b48; --ink: #e9edf3; --ink-2: #c9d0db; --muted: #949eac;
  --accent: #7b9bff; --accent-ink: #0b1020; --accent-soft: #1a2442; --accent-line: #34467e;
  --ok: #4fd39a; --ok-soft: #10291f; --warn: #f3b453; --warn-soft: #2e2210;
  --bad: #ff7a8c; --bad-soft: #33151b; --info: #9fb4d8; --info-soft: #182235;
  --na: #a3acb9; --na-soft: #1e232c; --desk: #07090c; --desk-dot: #1c222b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
svg.i.lg { width: 20px; height: 20px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.app > .col { min-width: 0; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px;
  padding: 14px 12px; background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; text-decoration: none; color: var(--ink); }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { font-size: 15px; letter-spacing: -.01em; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.navlabel { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
  background: none; color: var(--ink-2); text-align: left; font-weight: 500; transition: background .15s, color .15s; }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted); }
.side .foot { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.cadline { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 4px 10px; min-width: 0; }
.cadline span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--na); box-shadow: 0 0 0 3px var(--na-soft); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }

.top { position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 12px;
  padding: 0 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--ink); }
.crumbs b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .spacer { flex: 1; }
.kbtn { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); min-width: 220px; }
.kbtn:hover { border-color: var(--line-strong); color: var(--ink); }
kbd { font: 600 11px/1 var(--font); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line-strong);
  border-bottom-width: 2px; background: var(--surface-2); color: var(--muted); }
.kbtn kbd { margin-left: auto; }
.iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); transition: background .15s, border-color .15s; }
.iconbtn:hover { background: var(--surface-2); border-color: var(--line-strong); }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
main { padding: 24px; max-width: 1680px; margin: 0 auto; width: 100%; }

/* ---------- primitives ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.ph h1 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
.ph p { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.ph .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 48px; }
.card > header h2 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.005em; }
.card > header .sub { color: var(--muted); font-size: 12px; }
.card > header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card .body { padding: 16px; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.card, .stack > *, .ws > *, .rp > * { min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 550; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, opacity .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.btn.ok:hover { background: var(--ok-soft); }
.btn.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.bad:hover { background: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn kbd { margin-left: 2px; }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--accent-ink) 45%, transparent); }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 11.5px; }
.input, select.input, textarea.input { height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); min-width: 0; width: 100%; transition: border-color .15s, box-shadow .15s; }
textarea.input { height: auto; min-height: 64px; padding: 8px 11px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.sm { height: 30px; font-size: 13px; }
.input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }

.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.pill svg.i { width: 13px; height: 13px; stroke-width: 2.2; vertical-align: 0; }
.t-ok { color: var(--ok); background: var(--ok-soft); } .t-warn { color: var(--warn); background: var(--warn-soft); }
.t-bad { color: var(--bad); background: var(--bad-soft); } .t-info { color: var(--info); background: var(--info-soft); }
.t-na { color: var(--na); background: var(--na-soft); } .t-accent { color: var(--accent); background: var(--accent-soft); }
.pill.outline { background: none; border-color: currentColor; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px;
  font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--surface-3); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 7px; color: var(--muted); font-weight: 550; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg .n { font-size: 11px; color: var(--muted); font-weight: 600; }

/* tables */
.tw { overflow: auto; }
table.dt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.dt th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; font-size: 11.5px; font-weight: 600;
  color: var(--muted); letter-spacing: .02em; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dt th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; }
.dt th button:hover { color: var(--ink); }
.dt th[aria-sort] button { color: var(--ink); }
.dt td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dt tr:last-child td { border-bottom: 0; }
.dt td.r, .dt th.r { text-align: right; }
.dt tbody tr.click { cursor: pointer; transition: background .12s; }
.dt tbody tr.click:hover td { background: var(--surface-2); }
.dt .title { font-weight: 600; color: var(--ink); }
.dt .subline { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }

.empty { display: grid; place-items: center; gap: 8px; text-align: center; padding: 40px 16px; color: var(--muted); }
.empty svg.i { width: 28px; height: 28px; stroke-width: 1.5; opacity: .7; }
.empty b { color: var(--ink); font-size: 14px; }
.skel { border-radius: 6px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: sk 1.2s infinite linear; }
@keyframes sk { to { background-position: -200% 0; } }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 14px 16px; display: grid; gap: 2px; }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .d { font-size: 12px; color: var(--muted); }

/* health bar */
.hbar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--surface-3); min-width: 90px; }
.hbar i { display: block; height: 100%; }
.hbar .ok { background: var(--ok); } .hbar .info { background: var(--info); opacity: .55; } .hbar .warn { background: var(--warn); } .hbar .bad { background: var(--bad); }
.hlegend { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; }

/* new inspection */
.newrun { display: grid; grid-template-columns: minmax(260px, 1fr) 150px 110px 190px auto; gap: 12px; align-items: end; }
.runstate { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 20px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- inspection workspace ---------- */
.ihead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.ihead h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; font-weight: 650; overflow-wrap: anywhere; }
.ihead .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ihead .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.gate { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; padding: 12px 16px; border-radius: var(--radius);
  border: 1px solid; margin-bottom: 14px; }
.gate.t-ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.gate.t-warn { border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.gate .gi { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, currentColor 14%, transparent); }
.gate b { display: block; font-size: 14px; color: inherit; }
.gate .why { color: var(--ink-2); font-size: 13px; }
.gate .stats { display: flex; gap: 18px; color: var(--ink-2); font-size: 12px; flex-wrap: wrap; justify-content: flex-end; }
.gate .stats b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.lineage { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin: -4px 0 14px; }
.lineage a { color: var(--accent); }

.ws { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; align-items: start; }
.viewer { position: sticky; top: calc(var(--top) + 14px); height: calc(100vh - var(--top) - 28px); min-height: 460px; display: flex; flex-direction: column; overflow: hidden; }
.vbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.vbar .zoom { min-width: 52px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vbar .legend { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.vbar .legend span { display: inline-flex; align-items: center; gap: 5px; }
.vbar .legend i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; display: inline-block; }
.stage { position: relative; flex: 1; overflow: hidden; background-color: var(--desk);
  background-image: radial-gradient(var(--desk-dot) 1px, transparent 1px); background-size: 18px 18px;
  cursor: grab; touch-action: none; user-select: none; }
.stage.dragging { cursor: grabbing; }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.paper { filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .18)); }
.bl { cursor: pointer; }
.bl .ld { fill: none; stroke-width: 1.4; }
.bl .an { stroke: none; }
.bl circle.c { fill: #ffffff; stroke-width: 2; }
.bl text { font-family: var(--font); font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.bl.s-ok { --b: #0f7a4f; } .bl.s-info { --b: #2456e6; } .bl.s-warn { --b: #b86400; } .bl.s-bad { --b: #c62038; } .bl.s-na { --b: #6b7480; }
.bl .ld { stroke: var(--b); } .bl .an { fill: var(--b); } .bl circle.c { stroke: var(--b); } .bl text { fill: var(--b); }
.bl.dim { opacity: .28; }
.bl:hover circle.c { stroke-width: 3; }
.bl.sel circle.c { fill: var(--b); stroke-width: 3; } .bl.sel text { fill: #ffffff; }
.bl.sel .ring { stroke: var(--b); opacity: .35; fill: none; stroke-width: 6; }
.bl.decided circle.c { stroke-dasharray: 3 2; }
.escm rect { fill: rgba(179, 100, 0, .08); stroke: #b86400; stroke-width: 1.5; stroke-dasharray: 4 3; }
.escm.sel rect { fill: rgba(179, 100, 0, .2); stroke-width: 2.5; }
.tip { position: absolute; z-index: 5; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: #0e1420; color: #f1f4f8;
  font-size: 12px; box-shadow: var(--shadow-lg); max-width: 280px; transform: translate(12px, 12px); }
.tip b { font-family: var(--mono); font-size: 13px; }
.minimapnote { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }

.rp { display: grid; gap: 14px; min-width: 0; position: sticky; top: calc(var(--top) + 14px); max-height: calc(100vh - var(--top) - 28px);
  overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; border-radius: var(--radius); align-content: start; }
.rp .card > header { padding: 10px 12px; }
.filters { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.search { position: relative; }
.search svg.i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .input { padding-left: 32px; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.clist { max-height: min(36vh, 420px); overflow: auto; overscroll-behavior: contain; }
.citem { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; width: 100%;
  padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; transition: background .12s; }
.citem:hover { background: var(--surface-2); }
.citem[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.bn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  border: 2px solid currentColor; font-variant-numeric: tabular-nums; background: var(--surface); }
.citem .co { font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem .sb { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem .st { display: grid; justify-items: end; gap: 3px; }
.c-ok { color: var(--ok); } .c-info { color: var(--info); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-na { color: var(--na); }

  ];
  let evSel = evTabs[0][0];

    ...esc.map(u => ({ label: sym(u.text), group: "Escalated", icon: "eye", run: () => pick("esc:" + u._i) }))];

// ---------- router ----------
async function route() {
  const hash = location.hash.slice(1);
  const tab = hash.startsWith("inspection=") ? "inspections" : (hash || "inspections");
  document.querySelectorAll(".nav").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  viewKeys = null; palExtra = [];
  try {
    if (hash.startsWith("inspection=")) await viewInspection(decodeURIComponent(hash.slice(11)));
    else if (tab === "tasks") await viewTasks();
    else if (tab === "changes") await viewChanges();
    else if (tab === "cad") await viewCad();
    else await viewInspections();
  } catch (e) { main.replaceChildren(card(null, null, null, empty("alert", "Could not load this page", e.message))); }
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => location.hash = b.dataset.tab));
window.addEventListener("hashchange", route);
route();
cadStatus(false);
api("/api/inspections").then(l => { runsCache = l; document.getElementById("n-insp").textContent = l.length || ""; }).catch(() => {});
